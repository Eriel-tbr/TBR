name: Sonda Audible
on:
  push:
    branches: [sonda-audible]
jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions: { deployments: read, contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Desde GitHub
        run: true || node -e "const h=require('./api/sonda-audible.js');h({}, {setHeader(){}, end(s){require('fs').writeFileSync('sonda-github.json', s)}})"
      - name: Universos
        run: node tools/sonda-universos.cjs
      - name: Guardar resultados
        if: ${{ github.event.head_commit.author.name != 'sonda' }}
        run: |
          git config user.name sonda; git config user.email sonda@users.noreply.github.com
          git add -f sonda-*.json sonda-*.txt; git commit -m "Sonda: resultados"; git push
