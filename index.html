<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi TBR</title>
<meta name="theme-color" content="#1e1428">
<meta name="app-version" content="2026.10.15-5">
<meta name="description" content="Mi lista de libros por leer, organizada en estanterías.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi TBR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Josefin+Sans:wght@600;700&family=Karla:wght@400;700&family=Lora:wght@600;700&family=Parisienne&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="css/styles.css?v=2026.10.15-5">
<link rel="stylesheet" href="css/furniture.css?v=2026.10.15-5">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><h1>Mi TBR</h1><div class="stats" id="stats"></div></div>
    <div class="tools">
      <button class="iconbtn" id="btnRandom" type="button" aria-label="Libro aleatorio"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.1"/><circle cx="15" cy="15" r="1.1"/><circle cx="15" cy="9" r="1.1"/><circle cx="9" cy="15" r="1.1"/></svg></button>
      <button class="iconbtn" id="btnFilter" type="button" aria-label="Buscar y filtrar" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="iconbtn" id="btnSettings" type="button" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg></button>
    </div>
  </div>
  <div class="addbar">
    <textarea id="addInput" class="one" rows="1" wrap="off" autocomplete="off" placeholder="Añadir un libro: escribe el título…" enterkeyhint="search" aria-label="Título del libro que quieres añadir"></textarea>
    <button class="btn" id="btnAddManual" type="button">A mano</button>
    <ul class="suggest" id="suggest" hidden></ul>
  </div>
  <div id="nextchip"></div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Estanterías"></nav>
<div class="filterbar" id="filterbar" hidden></div>
<div class="banner" id="banner" hidden></div>
<div class="banner cloudban" id="cloudban" hidden></div>
<main class="carousel" id="carousel"></main>
<button class="arrow l" type="button" aria-label="Estantería anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="arrow r" type="button" aria-label="Estantería siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div class="update" id="update" hidden><span>Hay una versión nueva</span><button class="btn sm primary" type="button" id="btnUpdate">Actualizar</button></div>
<script id="sb-lib" async crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="js/lib/util.js?v=2026.10.15-5"></script>
<script src="js/lib/busqueda.js?v=2026.10.15-5"></script>
<script src="js/lib/etiquetas.js?v=2026.10.15-5"></script>
<script src="js/art/decoracion.js?v=2026.10.15-5"></script>
<script src="js/art/lomos.js?v=2026.10.15-5"></script>
<script src="js/art/muebles.js?v=2026.10.15-5"></script>
<script src="js/art/temas.js?v=2026.10.15-5"></script>
<script src="js/app/estado.js?v=2026.10.15-5"></script>
<script src="js/app/hojas.js?v=2026.10.15-5"></script>
<script src="js/app/estanterias.js?v=2026.10.15-5"></script>
<script src="js/app/ficha.js?v=2026.10.15-5"></script>
<script src="js/app/ficha-extra.js?v=2026.10.15-5"></script>
<script src="js/app/formulario.js?v=2026.10.15-5"></script>
<script src="js/app/anadir.js?v=2026.10.15-5"></script>
<script src="js/app/ajustes.js?v=2026.10.15-5"></script>
<script src="js/app/arrastrar.js?v=2026.10.15-5"></script>
<script src="js/app/nube.js?v=2026.10.15-5"></script>
<script src="js/app/inicio.js?v=2026.10.15-5"></script>
</body>
</html>
